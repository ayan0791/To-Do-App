{% load static %}

<!DOCTYPE html>
<html>
<head>
    <title>Edit Todo</title>
    <link rel="stylesheet" href="{% static 'todo/style.css' %}">
</head>

<body>

<div class="container edit-container">

    <h1>Edit Todo</h1>

    <form method="POST" class="edit-form">
        {% csrf_token %}

        <input
            type="text"
            name="title"
            value="{{ todo.title }}"
            placeholder="Enter task"
        >

        <button type="submit">
            Save Changes
        </button>
    </form>

    <a href="/" class="cancel">
        Cancel
    </a>

</div>

</body>
</html>
